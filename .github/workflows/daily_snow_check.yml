name: Daily Snow Check


on:
  schedule:
    # ВРЕМЕННО ДЛЯ ТЕСТА: запуск в 09:25 и 09:35 UTC (11:25 и 11:35 по Израилю)
    - cron: '45,55 11 * * *'
    # Основное расписание (вернем после теста):
    # - cron: '25 6 * * SUN,MON,TUE,WED,THU'
  # Позволяет запускать скрипт вручную кнопкой из интерфейса GitHub для теста
  workflow_dispatch:

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run snow alert script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python europe_snow_alert/main.py

